name: build
on: [ push, workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Dump API Minecraft
        if: always()
        run: |
          J=$(find ~/.gradle /home/runner -name 'minecraft-merged-deobf*26.3*.jar' -not -name '*sources*' 2>/dev/null | head -1)
          echo "JAR: $J" | tee api-dump.txt
          dump() { echo "=== javap $1 ===" >> api-dump.txt; javap -p -cp "$J" "$1" >> api-dump.txt 2>&1; }
          echo "=== kelas RenderType/RenderTypes ===" >> api-dump.txt
          unzip -l "$J" | awk '{print $4}' | grep -E "RenderTypes?\.class|rendertype/" | head -40 >> api-dump.txt
          for c in \
            net.minecraft.client.renderer.FirstPersonHandsAndItemsRenderer \
            net.minecraft.client.player.FirstPersonHandsAndItems \
            net.minecraft.client.renderer.state.level.FirstPersonHandsAndItemsRenderState \
            'net.minecraft.client.renderer.state.level.FirstPersonHandsAndItemsRenderState$HandRenderSelection' \
            net.minecraft.client.renderer.OrderedSubmitNodeCollector \
            net.minecraft.client.model.geom.ModelPart \
            net.minecraft.client.model.player.PlayerModel \
            net.minecraft.world.entity.player.PlayerSkin \
            'net.minecraft.world.entity.player.PlayerSkin$Patch' \
            net.minecraft.world.entity.player.PlayerModelType \
            net.minecraft.client.renderer.item.ItemModelResolver \
            'net.minecraft.client.renderer.item.ItemStackRenderState$LayerRenderState' \
            net.minecraft.client.resources.model.cuboid.ItemTransform \
            net.minecraft.client.renderer.MapRenderer \
            net.minecraft.client.renderer.entity.EntityRenderDispatcher \
            net.minecraft.client.player.AbstractClientPlayer \
            com.mojang.blaze3d.vertex.PoseStack \
            net.minecraft.client.renderer.state.level.PlayerRenderState \
            net.minecraft.client.renderer.state.level.CameraRenderState ; do dump "$c"; done
          echo "=== GameRenderer renderItemInHand/bob ===" >> api-dump.txt
          javap -p -c -cp "$J" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -E "FirstPersonHands|renderItemInHand|bobHurt|bobView" >> api-dump.txt
          wc -c api-dump.txt
      - name: Upload API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: api-dump.txt
      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locomotion-26.3
          path: build/libs/*.jar
