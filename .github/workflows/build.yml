name: build
on: [ push, workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Isi jar
        run: |
          ls -la build/libs
          for j in build/libs/*.jar; do echo "== $j"; unzip -l "$j" | head -30; done
          echo "jumlah file java:"; find src -name '*.java' | wc -l
      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locomotion-26.3
          path: build/libs/*.jar
